  track: "AI"                          # REQUIRED — one of: AI | DevOps | Sustainability | Open
  lead:
    name: "Chetan Senta"               # REQUIRED — e.g., "Alice Chen"
    email: "your-email@ibm.com"        # REQUIRED — fill in before submitting
  members:
    - name: "Chetan Senta"             # REQUIRED — Team member 1
      email: "your-email@ibm.com"      # fill in before submitting

submission:
  title: "Mission Readiness & Predictive Maintenance Copilot"  # REQUIRED

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Military maintenance teams operate on fixed-schedule servicing cycles that ignore real-time
    platform health, leaving HUMS (Health & Usage Monitoring System) sensor data from engines,
    rotors, and hydraulics sitting unanalysed. As a result, unexpected component failures cause
    unplanned groundings that drive the US military's $90B/year maintenance spend and directly
    reduce operational readiness when mission windows are tight.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We built the Mission Readiness Officer, an IBM Bob Copilot backed by a FastAPI rules engine
    that ingests HUMS sensor telemetry via CSV upload, scores every component against
    configurable thresholds, and predicts which assets will fail before their next mission window.
    Maintenance crews converse naturally with Bob to query fleet status, understand failure risks,
    and receive a prioritised maintenance plan — with every recommendation explained in plain
    language by watsonx.ai.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "React fleet readiness dashboard — 25 assets scored GREEN/AMBER/RED with per-component breakdown"
    - "HUMS sensor ingestion via CSV upload — vibration, engine temp, oil quality index, hours-since-service"
    - "Rules-based failure prediction engine — components ranked CRITICAL/HIGH/MEDIUM by urgency and mission proximity"
    - "IBM Bob Mission Readiness Officer mode — MCP tool-calling to live FastAPI backend for conversational readiness queries"
    - "watsonx.ai natural-language explanations — every RED/AMBER finding explained in plain military language"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "SQLAlchemy", "Vite", "Tailwind CSS"]
    ibm_technologies: ["IBM Bob", "watsonx.ai"]
    databases: ["PostgreSQL"]
    other: ["Docker", "Docker Compose", "GitHub Actions"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    IBM Bob serves as the primary mission interface — not a cosmetic add-on. Bob uses tool-calling
    to query live FastAPI endpoints for fleet readiness, per-asset component breakdowns, failure
    predictions, and maintenance plans, then synthesises the structured JSON responses into concise
    military-style briefings powered by watsonx.ai. This makes Bob genuinely load-bearing: remove
    it and analysts lose their primary way to interrogate and act on maintenance data.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Sensor data is simulated — the dataset is synthetically generated and does not originate from
    real HUMS hardware. Readiness scoring uses rule-based thresholds rather than a trained ML model,
    so edge-case sensor patterns may be misclassified. The watsonx.ai explanation feature requires
    a valid IBM Cloud API key and project ID; without them the copilot falls back to structured
    JSON responses only.

